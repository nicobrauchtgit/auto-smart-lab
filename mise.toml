# Pinned toolchain, run through ./dev (which keeps mise and everything it
# installs under .tools/). uv manages Python itself: the version comes from
# .python-version; the finetuned harness's packages come from
# harness/finetuned/pyproject.toml and uv.lock, installed into its .venv.

[tools]
bun = "1.3.13"
uv = "0.12.5"
ripgrep = "15.2.0"
fd = "10.4.2"

[env]
_.file = { path = ".env", redact = true }
_.path = ["{{config_root}}/harness/finetuned/.venv/bin"]
VENV_DIR = "{{config_root}}/harness/finetuned/.venv"
VIRTUAL_ENV = "{{config_root}}/harness/finetuned/.venv"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/harness/finetuned/.venv"
# Only uv-managed Python: never pick up a Nix or system interpreter from PATH.
UV_PYTHON_PREFERENCE = "only-managed"
PI_CODING_AGENT_DIR = "{{config_root}}/harness/finetuned/.pi/agent"

[tasks.setup]
description = "Create harness/finetuned/.venv with the pinned Python and dependencies, install the JS dependencies"
run = [
	"uv run --no-project python harness/finetuned/agent/setup/python_environment.py setup",
	"bun install --frozen-lockfile",
]

[tasks.test]
description = "Check TypeScript types and run the TypeScript and Python test suites"
run = ["bun run typecheck", "bun test", "bun run test:py"]

[tasks.pi]
description = "Interactive pi with the project agent directory"
run = "bunx pi"
