# Pinned toolchain, run through ./dev (which keeps mise and everything it
# installs under .tools/). uv manages Python itself: the version comes from
# .python-version and pyproject.toml, packages from uv.lock.

[tools]
bun = "1.3.13"
uv = "0.12.5"
ripgrep = "15.2.0"
fd = "10.4.2"

[env]
_.file = { path = ".env", redact = true }
_.path = ["{{config_root}}/.venv/bin"]
VENV_DIR = "{{config_root}}/.venv"
VIRTUAL_ENV = "{{config_root}}/.venv"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
# Only uv-managed Python: never pick up a Nix or system interpreter from PATH.
UV_PYTHON_PREFERENCE = "only-managed"
PI_CODING_AGENT_DIR = "{{config_root}}/.pi/agent"
# Optional trace database; traces fall back to local JSONL when it is absent.
AGENT_DATABASE_PORT = "55433"
PGDATABASE = "postgres"
PGPORT = "55433"

[tasks.setup]
description = "Create .venv with the pinned Python and dependencies, install the JS dependencies"
run = [
	"uv run --no-project python agent/setup/python_environment.py setup",
	"bun install --frozen-lockfile",
]

[tasks.test]
description = "Run the TypeScript and Python test suites"
run = ["bun test", "bun run test:py"]

[tasks.pi]
description = "Interactive pi with the project agent directory"
run = "bunx pi"
